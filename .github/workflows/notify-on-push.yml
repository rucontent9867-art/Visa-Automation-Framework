# ==============================================================================
# GitHub Actions Workflow: Notify owner on push to dev branches
# NOTE: Add NOTIFY_WEBHOOK to repo Settings → Secrets and variables → Actions.
# Works with Discord, Slack, ntfy, or any generic webhook URL endpoint.
# ==============================================================================

name: Notify owner on push to dev branches

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook
        run: |
          curl -sS -X POST "${{ secrets.NOTIFY_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"Push by ${{ github.actor }} to ${{ github.ref_name }}: ${{ github.event.head_commit.message }}\"}"
